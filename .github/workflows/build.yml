name: Build

on:
  push:
    branches: [main]
  pull_request:
  # Lets a build be kicked off by hand from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run compile

      - name: Test
        run: npm test

      - name: Build and package
        run: npm run zip

      # upload-artifact skips anything inside a dot-directory by default, and the build
      # output lives in `.output`, so hidden files have to be opted back in.
      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: session-bug-reporter-${{ github.sha }}
          path: .output/*.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
